[project]
name = "odm-map-maker"
version = "0.1.0"
description = "Create LinkML-Map schemas for odm-map"
authors = [
    { name="Martin Wellman", email="mwellman@ohri.ca" }
]
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
odm-map-maker = "odm_map_maker.make_mappers_cli:app"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odm_map_maker"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]