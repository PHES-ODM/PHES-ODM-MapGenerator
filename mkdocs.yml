site_name: PHES-ODM MapGenerator
site_description: >-
  Generate LinkML Map specifications for converting wastewater surveillance
  data between ODM v1, NWSS, PHA4GE, and ODM v2/v3.
site_url: https://phes-odm.github.io/PHES-ODM-MapGenerator/
repo_url: https://github.com/PHES-ODM/PHES-ODM-MapGenerator
repo_name: PHES-ODM/PHES-ODM-MapGenerator
# The default branch is "main"; without this mkdocs derives "edit/master/docs/"
# and every "Edit on GitHub" link 404s.
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: img/ODM-logo.png
  favicon: img/ODM-logo.png
  features:
    # No navigation.tabs: keeping every section in the left sidebar gives a full
    # table of contents for the whole site rather than one tab at a time.
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Required for the :material-...: icons used in the card grid on the home page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# These documents are primarily read on GitHub, so they link to source files
# and to the root-level README.md and CONTRIBUTING.md using repository-relative
# paths. Those targets live outside docs_dir, so mkdocs cannot resolve them and
# would otherwise report each one as a broken link. mkdocs cannot tell those
# apart from genuinely broken links, so cross-document links are checked
# separately by .github/scripts/check_doc_links.py instead.
validation:
  links:
    not_found: ignore

# The four sections follow the Divio/Diataxis framework: tutorials teach,
# how-to guides solve a task, explanation gives background, reference describes.
# A new document belongs in exactly one of them — if it seems to fit two, it is
# probably two documents.
#
# Each section's index.md is listed bare rather than as "Overview: ...", so that
# the navigation.indexes feature attaches it to the section heading itself.
nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Generate your first mappers: tutorials/generate-your-first-mappers.md
      - Write a mapping from scratch: tutorials/write-a-mapping-from-scratch.md
  - How-to guides:
      - how-to/index.md
      - Fix an incorrect mapping: how-to/fix-a-mapping.md
      - Map a wide column: how-to/map-a-wide-column.md
      - Normalize slot names: how-to/normalize-slot-names.md
      - Find out why a row was ignored: how-to/find-out-why-a-row-was-ignored.md
      - Generate mappers for ODM v2: how-to/target-odm-v2.md
      - Add a new source dataset: how-to/add-a-new-source-dataset.md
      - Check generated mappers: how-to/check-generated-mappers.md
  - Explanation:
      - explanation/index.md
      - Concepts and Vocabulary: explanation/concepts.md
      - Architecture: explanation/architecture.md
      - Wide Columns: explanation/wide-columns.md
  - Reference:
      - reference/index.md
      - Mapping Configuration Files: reference/mapping-config-files.md
      - CLI Configuration Files: reference/cli-config-files.md
      - Mapper Validator: reference/mapper-validator.md
      - Slot Derivations Checker: reference/slot-derivations-checker.md
      - ODM v1 to vx (legacy): reference/make-v1-to-vx.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PHES-ODM/PHES-ODM-MapGenerator
    - icon: fontawesome/solid/globe
      link: https://phes-odm.org
